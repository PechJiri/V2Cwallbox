<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <title>V2C Wallbox</title>
 <link rel="stylesheet" href="./widget.css">
 <style>html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:transparent;}</style>
</head>
<body class="homey-widget-full">
 <main id="wallbox"></main>
 <script src="./widget-core.js"></script>
 <script src="./widget-view.js"></script>
 <script src="./widget-controller.js"></script>
 <script>
 (function(){
  'use strict';
  let mounted=false,view,controller,visible=true;
  window.onHomeyReady=function(Homey){
   if(mounted||!Homey)return;mounted=true;
   const translate=(key,fallback)=>{
    try{const full='v2c_scene_widget.'+key;const value=typeof Homey.__==='function'?Homey.__(full):null;return typeof value==='string'&&value!==full?value:fallback;}catch(_){return fallback;}
   };
   view=V2CView.create(document.getElementById('wallbox'),{
    translate,
    onAction:action=>controller&&controller.act(action),
    onVisibility:value=>{visible=value;if(controller)controller.setActive(visible&&!document.hidden);}
   });
   let settings,deviceId;
   try{
    settings=typeof Homey.getSettings==='function'?Homey.getSettings()||{}:{};
    deviceId=V2CCore.selectedDeviceId(settings);
   }catch(_){view.render(V2CCore.empty('selection'));Homey.ready();return;}
   const seconds=Number(settings.update_interval);
   controller=V2CController.create(Homey,view,{deviceId,intervalMs:Number.isFinite(seconds)&&seconds>0?seconds*1000:5000});
   const visibility=()=>controller.setActive(visible&&!document.hidden);
   document.addEventListener('visibilitychange',visibility);
   window.addEventListener('pagehide',()=>{controller.destroy();view.destroy();document.removeEventListener('visibilitychange',visibility);},{once:true});
   Homey.ready(); // Height is defined only in widget.compose.json (180), avoiding layout shifts.
   controller.start();visibility();
  };
  if(window.Homey)window.onHomeyReady(window.Homey);
  document.addEventListener('homey_ready',()=>window.onHomeyReady(window.Homey),{once:true});
 })();
 </script>
</body>
</html>
